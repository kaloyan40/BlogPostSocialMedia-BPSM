{% extends 'base.html' %}

{% block title %}Вход{% endblock %}

{% block main %}
    <form method="POST" class="form-group card p-4">
        {% csrf_token %}

        <h1 class="text-center fw-light mb-3">Вход</h1>

        {% include 'includes/errors.html' %}

        <div class="form-floating mb-3">
            {{ form.username }}
            <label for="username">Имейл адрес / Потребителско име</label>
        </div>

        <div class="form-floating mb-3">
            {{ form.password }}
            <label for="password">Парола</label>
        </div>

        <div class="d-flex align-items-center gap-1">
            <button type="submit" class="btn btn-primary">Влез</button>
            <a href="{% url 'sign-up' %}" class="btn btn-secondary border">Регистрация</a>
            <a href="{% url 'password_reset' %}" class="btn btn-secondary border no-wrap">Забравена парола?</a>
        </div>
    </form>
{% endblock %}
