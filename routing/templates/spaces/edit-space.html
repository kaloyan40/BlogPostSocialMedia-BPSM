{% extends 'base.html' %}

{% block title %}Редактирай тема{% endblock %}

{% block head %}
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet" />
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.3/dist/purify.min.js"></script>
{% endblock %}

{% block main %}
    <form method="POST" action="{% url 'edit_space' space.slug %}" enctype="multipart/form-data" class="form-group card p-4" id="app" ref="form" @submit.prevent>
        {% csrf_token %}

        <h1 class="text-center fw-light">Редактирай тема</h1>
        <small class="text-center mb-3">Редактираш темата <a href="{% url 'space_details' slug=space.slug %}">{{ space.name }}</a>.</small>

        <div class="form-floating mb-3">
            {{ form.name }}
            <label for="name">Въведи име</label>
        </div>

        <div class="form-floating mb-3 form-content">
            {{ form.description }}
            <div id="editor" class="form-control"></div>
        </div>

        <button type="button" class="btn btn-primary mt-4" @click="submitForm">Редактирай</button>
    </form>
{% endblock %}

{% block rest %}
<script>
    axios.defaults.xsrfCookieName = 'csrftoken';
    axios.defaults.xsrfHeaderName = "X-CSRFTOKEN";

    new Vue({
        delimiters: ['[[', ']]'],
        el: '#app',
        data: {
            descriptionInput: '',
            nameInput: '{{ space.name }}',
        },
        methods: {
            submitForm() {
                // Validation before submitting (if needed)

                this.$refs.form.submit();
            },
        },
        mounted() {
            {# QUILL #}
            const place = 'space';
            {% include 'includes/js/quill-setup.js' %}
            quill.clipboard.dangerouslyPasteHTML('{{ space.description|escapejs|safe }}');
        }
    });
</script>
<style>
    {% include 'includes/css/quill.css' %}
</style>
{% endblock %}
